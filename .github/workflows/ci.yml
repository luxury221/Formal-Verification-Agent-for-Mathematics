name: P0 quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 ops/scripts/check_source.py
      - run: python3 -m unittest discover -s tests -v
  real-lean:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 ops/scripts/bootstrap_runtime.py
      - run: python3 ops/scripts/extract_lean.py
      - run: python3 ops/scripts/bootstrap_mathlib.py
      - run: python3 ops/scripts/prepare_mathlib_cache.py
      - run: python3 ops/scripts/seal_runtime.py
      - run: MRA_REAL_LEAN=1 python3 -m unittest discover -s tests -v
      - run: python3 -m mra benchmark
